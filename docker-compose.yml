version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: notemeet-postgres
    environment:
      POSTGRES_USER: devuser
      POSTGRES_PASSWORD: devpassword
      POSTGRES_DB: notemeet
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U devuser -d notemeet"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - notemeet-network
volumes:
  postgres_data:
  ollama_data:

networks:
  notemeet-network:
    driver: bridge
